<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tada icon</title>
<style>
  /* The plugin icon: the home page's sampler reduced to four pads, one lit. Rendered at 1024x1024. */
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .body {
    position: absolute; inset: 40px; border-radius: 210px;
    background: linear-gradient(180deg, #cdd6d9, #b9c4c8 22%, #b9c4c8);
    border: 6px solid #93a0a6;
    box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.7), inset 0 -14px 0 rgba(0, 0, 0, 0.08);
    display: grid; grid-template-columns: 1fr 1fr; gap: 56px; padding: 150px;
    box-sizing: border-box;
  }
  .pad {
    border-radius: 72px; background: #dfe4e5; border: 5px solid #a9b4b8;
    box-shadow: 0 18px 0 #a9b4b8, inset 0 6px 0 rgba(255, 255, 255, 0.8);
  }
  .pad.lit {
    background: #f0a433; border-color: #c98419;
    box-shadow: 0 18px 0 #c98419, 0 0 90px rgba(240, 164, 51, 0.85), inset 0 6px 0 rgba(255, 255, 255, 0.5);
  }
</style>
</head>
<body>
  <div class="body"><div class="pad lit"></div><div class="pad"></div><div class="pad"></div><div class="pad"></div></div>
</body>
</html>
